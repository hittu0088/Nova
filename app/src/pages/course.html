<!DOCTYPE html>
<html>
<head>
  <title>Course</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="header">
    <button onclick="history.back()" class="btn">Back</button>
    <h2 id="title"></h2>
  </div>

  <div id="content"></div>

<script>
const course = JSON.parse(localStorage.getItem('currentCourse'));
document.getElementById('title').innerText = course.title;
document.getElementById('content').innerHTML = `<p>${course.desc||''}</p>`;
</script>
</body>
</html>
